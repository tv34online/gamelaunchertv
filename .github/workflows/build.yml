name: Build TV34 Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TV34-Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV34-Launcher
          path: TV34-Launcher.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create latest TV34-Launcher.apk --repo "$GITHUB_REPOSITORY" \
            --title "TV34 Launcher (latest)" --notes "Автосборка из $GITHUB_SHA"
